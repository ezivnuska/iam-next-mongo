# HTTPS configuration (uncomment after SSL setup)
server {
     listen 443 ssl http2;
     listen [::]:443 ssl http2;
     server_name iameric.me www.iameric.me;

     ssl_certificate /etc/letsencrypt/live/iameric.me/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/iameric.me/privkey.pem;
     ssl_protocols TLSv1.2 TLSv1.3;
     ssl_ciphers HIGH:!aNULL:!MD5;

     error_page 502 503 504 /502.html;
     location = /502.html {
         root /var/www/iam-next-mongo/public;
         internal;
     }

     location / {
         proxy_pass http://localhost:3000;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection 'upgrade';
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_cache_bypass $http_upgrade;

         proxy_buffering off;
         proxy_set_header X-Forwarded-Host $host;
         proxy_set_header X-Forwarded-Port $server_port;
     }

     location /api/socket/io {
         proxy_pass http://localhost:3000;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection "upgrade";
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;

         proxy_read_timeout 86400;
         proxy_send_timeout 86400;
     }
}